name: DSLI R1 Characterization Execution

on:
  push:
    branches:
      - agent/dsli-r1-characterization-runner

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4

      - name: Install frozen CPython 3.12.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'
          check-latest: false

      - name: Verify frozen runtime
        shell: bash
        run: |
          python --version
          python - <<'PY'
          import sys
          assert sys.version_info[:3] == (3, 12, 11), sys.version
          PY

      - name: Execute frozen DSLI_R1 characterization
        run: python audits/_execution_dsli_r1_characterization.py

      - name: Upload characterization evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsli-r1-characterization-3.12.11
          path: characterization_out/
          if-no-files-found: error
          retention-days: 7
